[package]
name = "news-feed"
version = "0.14.3"
description = "Ứng dụng đọc tin công nghệ dạng dashboard"
authors = ["News Feed"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "news_feed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: cho phép giao diện đọc ảnh đệm từ thư mục trên máy.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
scraper = "0.23"
# Cùng phiên bản scraper 0.23 đang dùng, để kiểu cây dùng chung được. scraper
# không tái xuất ego_tree nên phải khai báo thẳng thì mới duyệt cây theo đúng
# thứ tự tài liệu được.
ego-tree = "0.10"
feed-rs = "2"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["gzip", "brotli", "rustls-tls", "charset"]

[dev-dependencies]
flate2 = "1"

[profile.release]
# Bản build nhẹ và ổn định: tối ưu kích thước, bỏ symbol.
#
# Cố ý KHÔNG đặt panic = "abort". Ứng dụng phân tích HTML và ảnh lấy từ
# Internet, tức dữ liệu không kiểm soát được; với abort thì một panic trong
# bộ giải mã sẽ giết cả tiến trình, người dùng chỉ thấy app tự thoát. Để
# panic cuộn ngăn xếp thì catch_unwind chặn được ngay tại chỗ hỏng.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
